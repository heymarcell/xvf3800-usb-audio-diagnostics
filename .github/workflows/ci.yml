name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PortAudio runtime
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Compile
        run: python -m py_compile diagnose.py tools/import_run.py
      - name: Simulated end-to-end report
        run: python diagnose.py --simulate --no-open --output ci-runs
